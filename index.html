<!doctype html><html lang="lv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irregular Verbs Trainer</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f2f5fc;color:#1c2b49}header{background:linear-gradient(120deg,#192e58,#476bd0);color:white;padding:28px 18px 44px}header>div,main{max-width:690px;margin:auto}h1{margin:0;font-size:26px}main{padding:0 14px 40px;margin-top:-20px}.card{background:white;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 5px 22px #1c2b4912}.nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.nav button{flex:1;min-width:95px}button{border:0;border-radius:12px;padding:13px;background:#e8eeff;color:#284990;font-weight:700;cursor:pointer;font-size:14px}button.primary,.nav .active{background:#385dcc;color:white}input,select{width:100%;padding:13px;border:1px solid #c8d1e5;border-radius:12px;font:16px system-ui;background:white}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}h2{font-size:21px;margin:0 0 12px}.word{font-size:44px;text-align:center;font-weight:800;margin:25px 0 0}.lv{text-align:center;color:#64718b}.answer{background:#edf2ff;padding:15px;border-radius:12px;margin:16px 0;line-height:1.8}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.barbg{background:#e7ebf4;height:9px;border-radius:12px;overflow:hidden;margin:13px 0}.bar{background:#5276dd;height:100%}.small{font-size:13px;color:#6a778f}.item{padding:11px 0;border-bottom:1px solid #e8ecf4}.item:last-child{border:0}.good{color:#087f54}.bad{color:#b32a40}.hidden{display:none}.score{font-size:44px;color:#365ac4;font-weight:800;text-align:center}footer{text-align:center;color:#7c879b;font-size:12px;padding:18px}p{line-height:1.5}</style>
<header><div><h1>📚 Irregular Verbs Trainer</h1><div style="opacity:.8">87 vārdi • Mācies • Pārbaudi • Atkārto</div></div></header>
<main><div class="nav"><button onclick="go('learn')" id="nlearn">📖 Mācīties</button><button onclick="go('test')" id="ntest">✍️ Tests</button><button onclick="go('errors')" id="nerrors">🔁 Kļūdas</button><button onclick="go('progress')" id="nprogress">📊 Progress</button></div><div id="app"></div><footer>Bez abonementa un reklāmām. Progress glabājas šajā pārlūkprogrammā.</footer></main>
<script>
const W=[["be", "was/were", "been", "būt", "special"], ["become", "became", "become", "kļūt", "aba"], ["begin", "began", "begun", "sākt", "iau"], ["bend", "bent", "bent", "liekt", "abb"], ["bite", "bit", "bitten", "kost", "en"], ["blow", "blew", "blown", "pūst", "ew"], ["break", "broke", "broken", "lauzt", "en"], ["bring", "brought", "brought", "atnest", "ought"], ["build", "built", "built", "būvēt", "t"], ["burn", "burned/burnt", "burned/burnt", "degt, dedzināt", "variant"], ["buy", "bought", "bought", "pirkt", "ought"], ["can", "could", "been able to", "varēt", "special"], ["catch", "caught", "caught", "noķert", "ought"], ["choose", "chose", "chosen", "izvēlēties", "en"], ["come", "came", "come", "nākt", "aba"], ["cost", "cost", "cost", "maksāt (cena)", "aaa"], ["cut", "cut", "cut", "griezt", "aaa"], ["do", "did", "done", "darīt", "special"], ["draw", "drew", "drawn", "zīmēt", "ew"], ["drink", "drank", "drunk", "dzert", "iau"], ["drive", "drove", "driven", "braukt, vadīt", "en"], ["eat", "ate", "eaten", "ēst", "en"], ["fall", "fell", "fallen", "krist", "en"], ["feel", "felt", "felt", "just", "t"], ["fight", "fought", "fought", "cīnīties", "ought"], ["find", "found", "found", "atrast", "abb"], ["fly", "flew", "flown", "lidot", "ew"], ["forget", "forgot", "forgotten", "aizmirst", "en"], ["get", "got", "got", "dabūt", "abb"], ["give", "gave", "given", "dot", "en"], ["go", "went", "gone", "iet", "special"], ["grow", "grew", "grown", "augt", "ew"], ["hang", "hung", "hung", "karāties, pakārt", "abb"], ["have", "had", "had", "būt īpašumā, būt", "abb"], ["hear", "heard", "heard", "dzirdēt", "abb"], ["hide", "hid", "hidden", "slēpt", "en"], ["hit", "hit", "hit", "sist", "aaa"], ["keep", "kept", "kept", "glabāt, turēt", "t"], ["know", "knew", "known", "zināt", "ew"], ["lay", "laid", "laid", "nolikt", "abb"], ["lead", "led", "led", "vadīt", "abb"], ["learn", "learned/learnt", "learned/learnt", "mācīties", "variant"], ["leave", "left", "left", "aiziet, atstāt", "t"], ["lend", "lent", "lent", "aizdot", "t"], ["lose", "lost", "lost", "zaudēt", "t"], ["make", "made", "made", "taisīt", "abb"], ["mean", "meant", "meant", "nozīmēt", "t"], ["meet", "met", "met", "satikt", "abb"], ["overcome", "overcame", "overcome", "pārvarēt", "aba"], ["pay", "paid", "paid", "maksāt", "abb"], ["put", "put", "put", "likt", "aaa"], ["read", "read", "read", "lasīt", "abb"], ["ride", "rode", "ridden", "jāt, braukt", "en"], ["ring", "rang", "rung", "zvanīt", "iau"], ["run", "ran", "run", "skriet", "aba"], ["say", "said", "said", "teikt", "abb"], ["see", "saw", "seen", "redzēt", "special"], ["sell", "sold", "sold", "pārdot", "abb"], ["send", "sent", "sent", "sūtīt", "t"], ["set", "set", "set", "iestatīt, nolikt", "aaa"], ["shake", "shook", "shaken", "kratīt", "en"], ["shine", "shone", "shone", "spīdēt", "abb"], ["shoot", "shot", "shot", "šaut", "abb"], ["show", "showed", "shown/showed", "rādīt", "special"], ["shut", "shut", "shut", "aizvērt", "aaa"], ["sing", "sang", "sung", "dziedāt", "iau"], ["sink", "sank", "sunk", "grimt", "iau"], ["sit", "sat", "sat", "sēdēt", "abb"], ["sleep", "slept", "slept", "gulēt", "t"], ["smell", "smelled/smelt", "smelled/smelt", "smaržot, saost", "variant"], ["speak", "spoke", "spoken", "runāt", "en"], ["spell", "spelled/spelt", "spelled/spelt", "burtot", "variant"], ["spend", "spent", "spent", "tērēt, pavadīt", "t"], ["spill", "spilled/spilt", "spilled/spilt", "izliet", "variant"], ["stand", "stood", "stood", "stāvēt", "abb"], ["steal", "stole", "stolen", "zagt", "en"], ["swim", "swam", "swum", "peldēt", "iau"], ["take", "took", "taken", "ņemt", "en"], ["teach", "taught", "taught", "mācīt", "ought"], ["tell", "told", "told", "stāstīt", "abb"], ["think", "thought", "thought", "domāt", "ought"], ["throw", "threw", "thrown", "mest", "ew"], ["understand", "understood", "understood", "saprast", "abb"], ["wake", "woke", "woken", "pamosties", "en"], ["wear", "wore", "worn", "valkāt", "en"], ["win", "won", "won", "uzvarēt", "abb"], ["write", "wrote", "written", "rakstīt", "en"]].map(([a,b,c,d,g],id)=>({a,b,c,d,g,id})),G={"aaa": "AAA — nemainās", "iau": "i–a–u", "ought": "-ought / -aught", "t": "ABB — galotne -t", "abb": "ABB — citas", "aba": "ABA — pirmā = trešā", "ew": "-ew → -own", "en": "Trešā forma -en/-n", "variant": "Divas formas", "special": "Īpašie"},K='irregular-verbs-v1';
let S;try{S=JSON.parse(localStorage.getItem(K))||{}}catch{S={}}S.stats ||= {};S.errors ||= [];
let view='learn',group='aaa',idx=0,session=null;
const el=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch{}},mix=a=>[...a].sort(()=>Math.random()-.5),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts=(v,all=false)=>(all?'<option value="all">Visi vārdi</option>':'')+Object.keys(G).map(k=>`<option value="${k}" ${v===k?'selected':''}>${G[k]} (${W.filter(w=>w.g===k).length})</option>`).join('');
function go(v){view=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.id==='n'+v));render()}
function render(){if(view==='learn')learn();if(view==='test')test();if(view==='errors')errors();if(view==='progress')progress()}
function learn(){let list=W.filter(w=>w.g===group),w=list[idx%list.length];el('app').innerHTML=`<div class="card"><h2>Mācies pēc līdzības</h2><label>Grupa</label><select onchange="group=this.value;idx=0;render()">${opts(group)}</select><p class="small">${idx+1} no ${list.length}</p><div class="barbg"><div class="bar" style="width:${(idx+1)/list.length*100}%"></div></div><div class="word">${esc(w.a)}</div><div class="lv">${esc(w.d)}</div><div class="answer" style="text-align:center;font-size:20px"><b>${esc(w.a)} → ${esc(w.b)} → ${esc(w.c)}</b></div>${w.a==='read'?'<p class="small">💡 Pagātnē read izrunā kā “red”.</p>':''}${w.a==='can'?'<p class="small">💡 been able to ir aizvietojoša konstrukcija, nevis can trešā forma.</p>':''}<div class="actions"><button onclick="idx=(idx-1+${list.length})%${list.length};render()">← Atpakaļ</button><button class="primary" onclick="idx=(idx+1)%${list.length};render()">Nākamais →</button></div></div><div class="card"><h2>Grupas vārdi</h2>${list.map(x=>`<div class="item"><b>${esc(x.a)} — ${esc(x.b)} — ${esc(x.c)}</b><div class="small">${esc(x.d)}</div></div>`).join('')}</div>`}
function test(){if(session){question();return}el('app').innerHTML=`<div class="card"><h2>Sāc testu ✍️</h2><p class="small">Ieraksti abas formas. Vari trenēties vienā grupā vai jauktā secībā.</p><label>Grupa</label><select id="group">${opts('all',true)}</select><label>Jautājumu skaits</label><select id="count"><option value="10">10</option><option value="20">20</option><option value="all">Visi izvēlētie</option></select><div class="actions"><button class="primary" onclick="start()">Sākt →</button></div></div>`}
function start(){let g=el('group').value,n=el('count').value,pool=mix(W.filter(w=>g==='all'||w.g===g));session={list:pool.slice(0,n==='all'?pool.length:+n),i:0,score:0,answers:[],checked:false};render()}
function question(){let s=session;if(s.i===s.list.length){finish();return}let w=s.list[s.i];el('app').innerHTML=`<div class="card"><h2>Jautājums ${s.i+1} / ${s.list.length}</h2><div class="barbg"><div class="bar" style="width:${s.i/s.list.length*100}%"></div></div><div class="word">${esc(w.a)}</div><div class="lv">${esc(w.d)}</div><div class="row"><div><label>Past simple</label><input id="b" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="2. forma"></div><div><label>Past participle</label><input id="c" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="3. forma"></div></div><div id="feedback"></div><div class="actions"><button id="check" class="primary" onclick="check()">Pārbaudīt</button><button id="next" class="primary hidden" onclick="session.i++;session.checked=false;render()">Nākamais →</button></div></div>`;el('b').focus();['b','c'].forEach(k=>el(k).addEventListener('keydown',e=>{if(e.key==='Enter')session.checked?el('next').click():check()}))}
function valid(v,expected){return expected.toLowerCase().split('/').some(x=>x.trim()===v.trim().toLowerCase())}
function check(){let s=session;if(s.checked)return;let w=s.list[s.i],b=el('b').value,c=el('c').value;if(!b.trim()||!c.trim()){alert('Ieraksti abas formas!');return}let p=valid(b,w.b),q=valid(c,w.c),ok=p&&q;s.checked=true;s.answers.push({w,ok});if(ok)s.score++;let st=S.stats[w.id]||{right:0,wrong:0};st[ok?'right':'wrong']++;S.stats[w.id]=st;if(!ok&&!S.errors.includes(w.id))S.errors.push(w.id);if(ok)S.errors=S.errors.filter(id=>id!==w.id);save();el('b').disabled=el('c').disabled=true;el('feedback').innerHTML=`<div class="answer"><div class="${p?'good':'bad'}">${p?'✓':'✗'} Past simple: <b>${esc(w.b)}</b></div><div class="${q?'good':'bad'}">${q?'✓':'✗'} Past participle: <b>${esc(w.c)}</b></div>${ok?'<b class="good">Lieliski! 🎉</b>':'<span class="small">Pievienots kļūdu atkārtošanai.</span>'}</div>`;el('check').classList.add('hidden');el('next').classList.remove('hidden');if(s.i===s.list.length-1)el('next').textContent='Rezultāts →'}
function finish(){let s=session,p=Math.round(s.score/s.list.length*100);el('app').innerHTML=`<div class="card"><h2>Tests pabeigts! 🎉</h2><div class="score">${p}%</div><p style="text-align:center">${s.score} no ${s.list.length} pareizi</p><div class="actions"><button onclick="session=null;render()">Jauns tests</button><button class="primary" onclick="session=null;go('errors')">Atkārtot kļūdas</button></div></div><div class="card"><h2>Atbildes</h2>${s.answers.map(x=>`<div class="item"><span class="${x.ok?'good':'bad'}">${x.ok?'✓':'✗'}</span> <b>${esc(x.w.a)}</b> — ${esc(x.w.b)} — ${esc(x.w.c)}</div>`).join('')}</div>`}
function errors(){let list=W.filter(w=>S.errors.includes(w.id));el('app').innerHTML=`<div class="card"><h2>Atkārto kļūdas 🔁</h2><p>${list.length?`${list.length} vārdi atkārtošanai`:'Kļūdu vēl nav. Izpildi testu!'}</p>${list.length?'<button class="primary" onclick="retry()">Trenēt kļūdainos vārdus</button>':''}</div>${list.length?`<div class="card">${list.map(w=>`<div class="item"><b>${esc(w.a)} — ${esc(w.b)} — ${esc(w.c)}</b><div class="small">${esc(w.d)}</div></div>`).join('')}</div>`:''}`}
function retry(){session={list:mix(W.filter(w=>S.errors.includes(w.id))),i:0,score:0,answers:[],checked:false};go('test')}
function progress(){let n=Object.keys(S.stats).length,r=Object.values(S.stats).reduce((s,x)=>s+x.right,0),f=Object.values(S.stats).reduce((s,x)=>s+x.wrong,0);el('app').innerHTML=`<div class="card"><h2>Mans progress 📊</h2><div class="row"><div><div class="score">${n}/${W.length}</div><p class="small" style="text-align:center">Izmēģināti vārdi</p></div><div><div class="score">${r+f?Math.round(r/(r+f)*100):0}%</div><p class="small" style="text-align:center">Pareizas atbildes</p></div></div><p>Jāatkārto: ${S.errors.length}</p></div><div class="card"><h2>Progress pa grupām</h2>${Object.keys(G).map(g=>{let a=W.filter(w=>w.g===g),n=a.filter(w=>S.stats[w.id]).length;return `<div class="item"><b>${G[g]}</b><div class="small">${n} / ${a.length} izmēģināti</div><div class="barbg"><div class="bar" style="width:${n/a.length*100}%"></div></div></div>`}).join('')}</div><div class="card"><p class="small">Dati glabājas tikai šajā pārlūkprogrammā. Dzēšot tās datus, progress var pazust.</p><button onclick="if(confirm('Dzēst visu progresu?')){S={stats:{},errors:[]};save();render()}">Dzēst progresu</button></div>`}
go('learn');
</script></html>
